<section class="page-hero">
  <div class="page-hero__map" aria-hidden="true"></div>
  <div class="wrap page-hero__inner">
    <p class="breadcrumb"><a href="index.html">Home</a><span>/</span>FAQ</p>
    <h1>{{heroTitle}}</h1>
    <p class="lede">{{heroLede}}</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="faq" id="faq">
{{#items}}
      <div class="faq__item">
        <button class="faq__q" aria-expanded="false">{{q}}<span class="faq__icon" aria-hidden="true"></span></button>
        <div class="faq__a"><div class="faq__a-inner">
          {{a}}
        </div></div>
      </div>
{{/items}}
    </div>
  </div>
</section>

<section class="section cta-band">
  <div class="cta-band__map" aria-hidden="true"></div>
  <div class="wrap">
    <p class="eyebrow center" style="justify-content:center">{{ctaEyebrow}}</p>
    <h2>{{ctaTitle}}</h2>
    <p>{{ctaText}}</p>
    <div class="btn-row"><a class="btn btn--primary" href="contact.html">{{ctaButton}}</a></div>
  </div>
</section>
